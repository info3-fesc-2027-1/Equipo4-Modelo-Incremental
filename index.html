<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
<!-- inicio parte del catalo -->
<script src="./RF1/clientes.js" type="module"></script>
<!-- fin parte del catalo -->
    <script src="./RF2/catalogo.js" type="module"></script>
</head>


<body>

<div class="fixed top-5 right-5 flex items-center gap-2.5 bg-white/90 px-4 py-1.5 rounded-full shadow-md z-50">
  <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar" class="w-10 h-10 rounded-full object-cover">
  <span id="username-display" class="font-medium text-gray-800">Usuario</span>

    <button id="logoutBtn" style="display: none;" class="text-xs text-red-500 hover:text-red-700 font-semibold ml-1 pl-2 border-l border-gray-200">
    Salir
  </button>

</div>


<div id="orderForm-container" class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
    <h3 class="text-2xl font-bold text-gray-800 text-center mb-6">Registro de clientes de la Joyería</h3>
    
    <form id="orderForm" class="space-y-4">
        <div>
            <label for="clientName" class="block text-sm font-medium text-gray-700 mb-1">Nombre del cliente:</label>
            <input type="text" id="clientName" placeholder="Ej. Juanito Alcachofa" required
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
            <label for="clientEmail" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico:</label>
            <input type="email" id="clientEmail" placeholder="Ej. juanito.lol03@gmail.com" required
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
            <label for="clientNotes" class="block text-sm font-medium text-gray-700 mb-1">Notas del pedido:</label>
            <textarea id="clientNotes" placeholder="Ingrese un comentario o sugerencia..."
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none h-24 resize-none"></textarea>
        </div>

        <button type="button" id="confirmBtn" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 shadow-md">
            Registrarse
        </button>
    </form>
</div>
<!-- inicio parte del catalogo -->
</form>
</div>

<!-- RF2 - Catálogo de Joyería -->
<!-- RF2 - Catálogo de Joyería -->
<div id="catalogo-container" class="w-[95%] mx-auto bg-white p-8 rounded-3xl shadow-xl border border-gray-100 mt-6">

    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">
        Catálogo de Joyería
    </h2>

    <input
        type="text"
        id="buscarProducto"
        placeholder="Buscar producto..."
        class="w-full p-3 border rounded-xl mb-4"
    />

    <div class="flex gap-2 flex-wrap mb-6">

        <button class="categoria-btn bg-indigo-500 text-white px-4 py-2 rounded-xl" data-cat="Todos">
            Todos
        </button>

        <button class="categoria-btn bg-gray-200 px-4 py-2 rounded-xl" data-cat="Anillos">
            Anillos
        </button>

        <button class="categoria-btn bg-gray-200 px-4 py-2 rounded-xl" data-cat="Collares">
            Collares
        </button>

        <button class="categoria-btn bg-gray-200 px-4 py-2 rounded-xl" data-cat="Pulseras">
            Pulseras
        </button>

        <button class="categoria-btn bg-gray-200 px-4 py-2 rounded-xl" data-cat="Aretes">
            Aretes
        </button>

    </div>

    <div
        id="catalogo-lista"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    </div>

    <div class="mt-8 bg-gray-100 p-4 rounded-xl">

        <h3 class="text-xl font-bold mb-3">
            Carrito de Compras
        </h3>

        <div id="carrito"></div>

        <h4 class="font-bold mt-3">
            Total: $<span id="total">0</span>
        </h4>

    </div>

</div>
<!--fin  parte del catalogo -->
<div class="orders-section" style="display: none;"> 
    <h2>Cliente registrados</h2>
    <div id="ordersList" class="orders-grid"></div>
</div>
</body>
